	<style>
	
	.slider{
		position: relative;
		width: 90%;
		max-width: 450px;
		margin: 10px auto 40px auto;
		overflow: hidden;
		border-radius: 50px;
		box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
	}
	
	.slider img{
		width: 100%;
		height: auto;
		display: none;
		border-radius: 10px;
	}
	
	img.displaySlide{
		display: block;
		animation-name: fade;
		animation-duration: 1.5s;
	}
	
	.slider button{
		position: absolute;
		top: 50%;
		transform: translateY(-50%);
		font-size: 2rem;
		padding: 10px 15px;
		border: none;
		background-color: rgba(0, 0, 0, 0.5);
		color: white;
		border-radius: 50%;
		z-index: 1;
		cursor: pointer;
		transition: background-color 0.3s;
	}
	
	.slider button:hover {
		background-color: rgba(0, 0, 0, 0.8);
	}
	
	.previous{
		left: 10px;
	}
	
	.next{
		right: 10px;
	}
	
	@keyframes fade{
		from {opacity: 0.5}
		to {opacity: 1}
	}
	
	</style>
	
	
</head>

	<section class="galleries">
    <h1>Image Galleries</h1>
	</section>
	
	<div class="slider">
		<div class="slides">
			<img class="slide" src="pictures/cat.jpg" alt="image1">
			<img class="slide" src="pictures/deanlist.jpg" alt="image2">
			<img class="slide" src="pictures/parents.jpg" alt="image3">
			<img class="slide" src="pictures/raya.jpg" alt="image4">
			<img class="slide" src="pictures/sem1.jpg" alt="image5">
			<img class="slide" src="pictures/trip.jpg" alt="image6">

		</div>
		<button class="previous" onclick="prevSlide()">&#10094;</button>
		<button class="next" onclick="nextSlide()">&#10095;</button>

	</div>
	<script>
	
	const slides = document.querySelectorAll(".slides img");
	let slideIndex = 0;
	let intervalId = null;
	
	initializeSlider();

	function initializeSlider(){
		
		if(slides.length > 0){
			slides[slideIndex].classList.add("displaySlide");
			intervalId = setInterval(nextSlide, 5000)
		}
		
	}

	function showSlide(index){
	
		if(index >= slides.length) {
			slideIndex  = 0;
		}
		
		else if(index < 0){
			slideIndex = slides.length -1;
		}
	
		slides.forEach(slide => {
			slide.classList.remove("displaySlide");
		});
		
		slides[slideIndex].classList.add("displaySlide");

	}

	function prevSlide(){
		clearInterval(intervalId);
		slideIndex--;
		showSlide(slideIndex);
		intervalId = setInterval(nextSlide, 5000);
	}

	function nextSlide(){
	
		slideIndex++;
		showSlide(slideIndex);
	}
	
	</script>
